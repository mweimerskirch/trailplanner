format.fit.label=parcours FIT

device.wahoo-elemnt.transfer.0.title=Copier par USB
device.wahoo-elemnt.transfer.0.step.0=Allumez l’ELEMNT et branchez-le avec un câble USB de données sur l’ordinateur où tourne Trail Planner, puis choisissez « Synchroniser avec l’ELEMNT » dans la bibliothèque : tous vos itinéraires actifs sont copiés.
device.wahoo-elemnt.transfer.0.step.1=Ou copiez vous-même ce GPX dans le dossier routes de l’appareil. Windows : il apparaît sous « Ce PC ». macOS : utilisez une application MTP comme OpenMTP. Linux : votre gestionnaire de fichiers, ou scripts/copy-to-bolt.sh.
device.wahoo-elemnt.transfer.0.step.2=Sur l’ELEMNT, ouvrez la page carte, choisissez ROUTE et appuyez sur SYNC si l’itinéraire n’apparaît pas.
device.wahoo-elemnt.transfer.1.title=Importer avec l’application ELEMNT
device.wahoo-elemnt.transfer.1.step.0=Sur votre téléphone, ouvrez le GPX (ou utilisez « Partager ») et choisissez l’application ELEMNT.
device.wahoo-elemnt.transfer.1.step.1=L’itinéraire est synchronisé avec l’ELEMNT par Bluetooth ou Wi‑Fi.
device.wahoo-elemnt.import=Branchez l’ELEMNT en USB, copiez les fichiers de son dossier routes sur votre ordinateur, puis importez-les ici.
device.wahoo-elemnt.sync.afterSync=Sur l’ELEMNT, ouvrez la page carte et choisissez ROUTE. Appuyez sur SYNC s’il manque un itinéraire.
device.wahoo-elemnt.sync.removalNote=L’ELEMNT garde les itinéraires déjà chargés : supprimez-les aussi sur l’appareil.

device.generic.name=Autre appareil ou application
device.generic.transfer.0.title=Utiliser le fichier
device.generic.transfer.0.step.0=Le GPX fonctionne avec presque toutes les applications et tous les appareils ; les appareils Garmin et Wahoo acceptent aussi les parcours FIT.
device.generic.transfer.0.step.1=Copiez le fichier sur l’appareil par USB, ou importez-le dans l’application de l’appareil.
device.generic.import=Exportez les itinéraires en GPX ou FIT depuis l’appareil ou son application, puis importez-les.

