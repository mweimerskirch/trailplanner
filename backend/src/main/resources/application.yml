server:
  port: 8081
  # Behind nginx in Docker; trust X-Forwarded-* for the client's host and scheme.
  forward-headers-strategy: framework

spring:
  application.name: trailplan
  datasource:
    url: jdbc:sqlite:${TRAILPLAN_DB:../data/trailplan.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; a single connection avoids SQLITE_BUSY errors.
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  mvc.problemdetails.enabled: true
  # Route imports: recorded tracks can be a few MB each, and several files are sent at once.
  servlet.multipart:
    max-file-size: 25MB
    max-request-size: 100MB
  jackson:
    default-property-inclusion: always

trailplan:
  # Host names under which the API may be used, besides IP addresses and localhost (protection against DNS rebinding). Comma-separated, e.g. "trailplan.home".
  allowed-hosts: ${TRAILPLAN_ALLOWED_HOSTS:}
  router:
    base-url: ${BROUTER_URL:http://localhost:17777}
    custom-profile-dir: ${BROUTER_CUSTOM_PROFILE_DIR:../data/customprofiles}
    timeout: PT60S
    leg-cache-size: 2000

management:
  endpoints.web.exposure.include: health
