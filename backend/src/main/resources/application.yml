server:
  port: 8081
  # Behind nginx in Docker; trust X-Forwarded-* so redirects use the public host.
  forward-headers-strategy: framework

spring:
  application.name: trailplan
  datasource:
    url: jdbc:sqlite:${TRAILPLAN_DB:../data/trailplan.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; a single connection avoids SQLITE_BUSY errors.
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  sql.init:
    mode: always
  mvc.problemdetails.enabled: true
  jackson:
    default-property-inclusion: always

trailplan:
  router:
    base-url: ${BROUTER_URL:http://localhost:17777}
    custom-profile-dir: ${BROUTER_CUSTOM_PROFILE_DIR:../data/customprofiles}
    timeout: PT60S
    leg-cache-size: 2000
  wahoo:
    enabled: ${WAHOO_ENABLED:false}
    client-id: ${WAHOO_CLIENT_ID:}
    client-secret: ${WAHOO_CLIENT_SECRET:}
    public-url: ${TRAILPLAN_PUBLIC_URL:http://localhost:5173}

management:
  endpoints.web.exposure.include: health
