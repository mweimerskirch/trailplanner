server:
  port: 8081
  # Behind nginx in Docker; trust X-Forwarded-* for the client's host and scheme.
  forward-headers-strategy: framework

spring:
  application.name: trailplanner
  datasource:
    url: jdbc:sqlite:${TRAILPLANNER_DB:../data/trailplan.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; a single connection avoids SQLITE_BUSY errors.
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  mvc.problemdetails.enabled: true
  # Route imports: recorded tracks can be a few MB each, and several files are sent at once.
  servlet.multipart:
    max-file-size: 25MB
    max-request-size: 100MB
  jackson:
    default-property-inclusion: always
  # Translations of server texts (messages_fr/de.properties), chosen by the Accept-Language the UI
  # sends. Without a translation the English text in the code is used, never the server's locale.
  messages:
    basename: messages
    fallback-to-system-locale: false

trailplanner:
  # Host names under which the API may be used, besides IP addresses and localhost (protection against DNS rebinding). Comma-separated, e.g. "trailplanner.home".
  allowed-hosts: ${TRAILPLANNER_ALLOWED_HOSTS:}
  # Where the map opens before anything is planned: "latitude,longitude[,zoom]". Blank: Luxembourg.
  area: ${TRAILPLANNER_AREA:}
  router:
    base-url: ${BROUTER_URL:http://localhost:17777}
    custom-profile-dir: ${BROUTER_CUSTOM_PROFILE_DIR:../data/customprofiles}
    timeout: PT60S
    leg-cache-size: 2000

management:
  endpoints.web.exposure.include: health
