format.fit.label=FIT-Strecke

device.wahoo-elemnt.transfer.0.title=Über USB kopieren
device.wahoo-elemnt.transfer.0.step.0=Schalte den ELEMNT ein, verbinde ihn mit einem USB-Datenkabel mit dem Computer, auf dem Trail Planner läuft, und wähle in der Bibliothek „Mit ELEMNT synchronisieren“: Alle aktiven Routen werden kopiert.
device.wahoo-elemnt.transfer.0.step.1=Oder kopiere dieses GPX selbst in den Ordner routes des Geräts. Windows: Es erscheint unter „Dieser PC“. macOS: Nutze eine MTP-App wie OpenMTP. Linux: Dein Dateimanager oder scripts/copy-to-bolt.sh.
device.wahoo-elemnt.transfer.0.step.2=Öffne auf dem ELEMNT die Kartenseite, wähle ROUTE und drücke SYNC, falls die Route fehlt.
device.wahoo-elemnt.transfer.1.title=Mit der ELEMNT-App importieren
device.wahoo-elemnt.transfer.1.step.0=Öffne das GPX auf dem Handy (oder nutze „Teilen“) und wähle die ELEMNT-App.
device.wahoo-elemnt.transfer.1.step.1=Die Route wird über Bluetooth oder WLAN mit dem ELEMNT synchronisiert.
device.wahoo-elemnt.import=Verbinde den ELEMNT über USB, kopiere die Dateien aus seinem Ordner routes auf deinen Computer und importiere sie hier.
device.wahoo-elemnt.sync.afterSync=Öffne auf dem ELEMNT die Kartenseite und wähle ROUTE. Drücke SYNC, falls eine Route fehlt.
device.wahoo-elemnt.sync.removalNote=Der ELEMNT behält bereits geladene Routen: Lösche sie auch auf dem Gerät.

device.generic.name=Anderes Gerät oder andere App
device.generic.transfer.0.title=Datei verwenden
device.generic.transfer.0.step.0=GPX funktioniert mit fast allen Apps und Geräten; Garmin- und Wahoo-Geräte nehmen auch FIT-Strecken.
device.generic.transfer.0.step.1=Kopiere die Datei über USB auf das Gerät oder importiere sie in der App des Geräts.
device.generic.import=Exportiere die Routen als GPX oder FIT aus dem Gerät oder seiner App und importiere sie dann.

