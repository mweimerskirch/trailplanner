server {
  listen 80;
  root /usr/share/nginx/html;

  # GPX exports and route saves recalculate the track; allow for slow routing.
  proxy_read_timeout 120s;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";

    # The MapLibre worker is an ES module (.mjs). nginx's mime.types does not list .mjs, and
    # browsers refuse to start a module worker that is not served as JavaScript.
    location ~ \.mjs$ {
      default_type application/javascript;
    }
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
