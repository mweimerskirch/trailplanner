server {
  listen 80;
  root /usr/share/nginx/html;

  # Route saves, exports and conversions route many legs, Komoot imports fetch many tours: allow
  # for slow requests (the app imports large selections in batches).
  proxy_read_timeout 300s;
  # Route imports upload several GPX/FIT files at once (backend limit: 100 MB per request).
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";

    # The MapLibre worker is an ES module (.mjs). nginx's mime.types does not list .mjs, and
    # browsers refuse to start a module worker that is not served as JavaScript.
    location ~ \.mjs$ {
      default_type application/javascript;
    }
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
